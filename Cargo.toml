[workspace]
resolver = "2"
members = [
    "contracts/guard-reference",
    "contracts/guard-naive",
    "contracts/scoreboard",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
near-sdk = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
strip = true
# Contracts must panic on arithmetic overflow rather than wrap silently.
overflow-checks = true
