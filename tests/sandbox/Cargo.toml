[package]
name = "agentfuzz-sandbox-tests"
description = "near-workspaces integration tests: AgentFuzz guards on a real nearcore sandbox (Linux/macOS)."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone (not a member of the contracts workspace): near-workspaces is heavy and the
# sandbox binary only exists for Linux and macOS.
[workspace]

[dependencies]

[dev-dependencies]
near-workspaces = { version = "=0.24.0", default-features = false, features = ["install"] }
near-sdk = { version = "=5.30.1", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
# Build OpenSSL from source so the suite needs no system libssl-dev / pkg-config.
openssl = { version = "0.10", features = ["vendored"] }
